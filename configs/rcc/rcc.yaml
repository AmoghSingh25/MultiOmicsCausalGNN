  rna_data: Data/input_data/KidneyTumorData/frmt_transcriptomics.csv
  metab_data: Data/input_data/KidneyTumorData/frmt_metabolomics.csv
  prot_data: Data/input_data/KidneyTumorData/frmt_proteomics.csv
  base_network_file: human_base_network.graphml
causal:
  filt_rna: Data/input_data/KidneyTumorData/renal_cancer_gene_filt.txt
  filt_prot: Data/input_data/KidneyTumorData/renal_cancer_prot_filt.txt
  llm:
    objective: None
    model_id: meta-llama-3.1-8b-instruct
    temperature: 0.7
    rag: true
    context: 100000
perform_intervention: false