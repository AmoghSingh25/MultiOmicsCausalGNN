# @package _global_
defaults:
  - ../main@_global_
name: rcc
model:
  epochs: 1000
  train_test_ratio: 0.7
  save_file: saved_weights.pt
  runs: 5
  prot_loss: 0.6
  metab_loss : 0.4
  seed:
    - 2729424255
    - 3683917037
    - 2667104789
    - 2821685283
    - 4015210798
data:
  predefined_network: false
  use_causal_edges: true
  significant_ppi: false
